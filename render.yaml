services:
  - type: web
    name: jm-backend-worker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start --workspace @jm/backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
